<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Codex's usage: six interlaced loops, a knot, one colour (a personal-use mark). -->
  <circle cx="32" cy="32" r="30" fill="#16294a" stroke="#e8eef7" stroke-width="2.5"/>
  <g fill="none" stroke="#e8eef7" stroke-width="2.8" stroke-linejoin="round">
    <rect x="26" y="9" width="12" height="25" rx="6" transform="rotate(0 32 32)"/>
    <rect x="26" y="9" width="12" height="25" rx="6" transform="rotate(60 32 32)"/>
    <rect x="26" y="9" width="12" height="25" rx="6" transform="rotate(120 32 32)"/>
    <rect x="26" y="9" width="12" height="25" rx="6" transform="rotate(180 32 32)"/>
    <rect x="26" y="9" width="12" height="25" rx="6" transform="rotate(240 32 32)"/>
    <rect x="26" y="9" width="12" height="25" rx="6" transform="rotate(300 32 32)"/>
  </g>
</svg>
