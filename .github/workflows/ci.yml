name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Format, lint and typecheck: the same commands as 'make check' runs.
  # Typecheck fetches the client library first ('make vendor').
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Format check
        run: make format-check
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck

  # The unit tests need no root, touch bar, Herdr or firstmate. Oldest
  # supported Python and a current one; 'make test' fetches the client
  # library first. The install.sh tests run the system /usr/bin/python3.
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: make test
